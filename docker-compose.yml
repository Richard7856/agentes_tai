# Infraestructura base — Fase 1 (4 agentes, sin Ollama).
# Nombre de proyecto fijo → contenedores/volúmenes/red namespaced como `nucleo_*`
# para no chocar con otros proyectos del mismo host.
# Solo el TABLERO publica puerto al host (configurable con DASHBOARD_PORT).
# El resto de servicios hablan por la red interna; NO se exponen (más seguro en VPS compartido).
# Para depurar en local con puertos: añade `-f docker-compose.dev.yml`.
# Para Fase 2 (Ollama): añade `-f docker-compose.ollama.yml`.
name: nucleo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/10-migrations:ro
      - ./db/seed:/docker-entrypoint-initdb.d/20-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LLM_REDACT_PII: ${LLM_REDACT_PII}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    depends_on:
      postgres:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile

  # ── Agentes Fase 1 ────────────────────────────────────────────────────
  agent-peticiones:
    build:
      context: .
      dockerfile: services/agents/peticiones-ciudadanas/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      SELF_URL: http://agent-peticiones:8000
    depends_on: [orchestrator, llm-gateway]

  agent-agenda:
    build:
      context: .
      dockerfile: services/agents/agenda-reuniones/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      SELF_URL: http://agent-agenda:8000
    depends_on: [orchestrator, llm-gateway]

  agent-pendientes:
    build:
      context: .
      dockerfile: services/agents/pendientes-prioridades/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      SELF_URL: http://agent-pendientes:8000
    depends_on: [orchestrator, llm-gateway]

  agent-acuerdos:
    build:
      context: .
      dockerfile: services/agents/control-acuerdos/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      SELF_URL: http://agent-acuerdos:8000
    depends_on: [orchestrator, llm-gateway, ocr]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      ORCH_URL: ${ORCH_URL}
    # Único puerto publicado al host. Cambia DASHBOARD_PORT si 3000 está ocupado.
    ports: ["${DASHBOARD_PORT:-3000}:3000"]
    depends_on: [orchestrator]

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${PG_DB}
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
