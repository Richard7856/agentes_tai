# Infraestructura base — Fase 1 (4 agentes, sin Ollama).
# Para Fase 2: `docker compose -f docker-compose.yml -f docker-compose.ollama.yml up`
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/10-migrations:ro
      - ./db/seed:/docker-entrypoint-initdb.d/20-seed:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      LLM_REDACT_PII: ${LLM_REDACT_PII}
      DATABASE_URL: ${DATABASE_URL}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    ports: ["8002:8000"]

  # ── Agentes Fase 1 (puertos 8101-8104) ────────────────────────────────
  agent-peticiones:
    build:
      context: .
      dockerfile: services/agents/peticiones-ciudadanas/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: ${DATABASE_URL}
      SELF_URL: http://agent-peticiones:8000
    ports: ["8101:8000"]
    depends_on: [orchestrator, llm-gateway]

  agent-agenda:
    build:
      context: .
      dockerfile: services/agents/agenda-reuniones/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: ${DATABASE_URL}
      SELF_URL: http://agent-agenda:8000
    ports: ["8102:8000"]
    depends_on: [orchestrator, llm-gateway]

  agent-pendientes:
    build:
      context: .
      dockerfile: services/agents/pendientes-prioridades/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: ${DATABASE_URL}
      SELF_URL: http://agent-pendientes:8000
    ports: ["8103:8000"]
    depends_on: [orchestrator, llm-gateway]

  agent-acuerdos:
    build:
      context: .
      dockerfile: services/agents/control-acuerdos/Dockerfile
    environment:
      GATEWAY_URL: ${GATEWAY_URL}
      ORCH_URL: ${ORCH_URL}
      DATABASE_URL: ${DATABASE_URL}
      SELF_URL: http://agent-acuerdos:8000
    ports: ["8104:8000"]
    depends_on: [orchestrator, llm-gateway, ocr]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      ORCH_URL: ${ORCH_URL}
    ports: ["3000:3000"]
    depends_on: [orchestrator]

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${PG_DB}
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
    ports: ["5678:5678"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
