[project]
name = "nucleo-core"
version = "0.1.0"
description = "Contrato compartido del Núcleo Operativo: BaseAgent, cliente del gateway, schemas."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nucleo_core*"]
